spring:
  application:
    name: my-notes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/my_notes}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
server:
  forward-headers-strategy: none
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
app:
  proxy:
    secret: ${EDGE_PROXY_SECRET:}
  public-origin: ${APP_PUBLIC_ORIGIN:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:0}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${MAIL_FROM:}
    tls-mode: ${SMTP_TLS_MODE:starttls}
  session:
    cookie-secure: true
  oauth:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.session: INFO
